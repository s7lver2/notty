[package]
name = "notty"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[[bin]]
name = "notty"
path = "src/main.rs"

[dependencies]
notty-config = { path = "../notty-config" }
notty-input = { version = "0.1.0", path = "../notty-input" }
notty-ipc = { version = "0.1.0", path = "../notty-ipc" }
notty-ui = { path = "../notty-ui" }
notty-update = { version = "0.1.0", path = "../notty-update" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_Com", "Win32_System_IO", "Win32_System_LibraryLoader", "Win32_System_Pipes", "Win32_UI_Input_KeyboardAndMouse", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_UI_WindowsAndMessaging"] }

[build-dependencies]
embed-resource = "3.0.11"
