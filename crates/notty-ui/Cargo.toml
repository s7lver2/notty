[package]
name = "notty-ui"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true

[dependencies]
notty-config = { path = "../notty-config" }
notty-core = { path = "../notty-core" }
notty-input = { path = "../notty-input" }
notty-io = { path = "../notty-io" }
windows = { version = "0.62.2", features = ["Win32_Foundation", "Win32_UI_WindowsAndMessaging", "Win32_Graphics_Gdi", "Win32_Graphics_Dwm", "Win32_System_LibraryLoader", "Win32_UI_Input_KeyboardAndMouse", "Win32_System_Registry", "Win32_Graphics_Direct2D", "Win32_Graphics_Direct2D_Common", "Win32_Graphics_DirectWrite", "Win32_Graphics_Dxgi_Common", "Win32_UI_HiDpi", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_Ole", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_Shell_Common", "Win32_System_Com"] }
windows-numerics = { version = "0.3.1", features = ["std"] }

[dev-dependencies]
tempfile.workspace = true
