[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
ropey = "1.6"
regex = "1"
thiserror = "2"
encoding_rs = "0.8"
memmap2 = "0.9"
tempfile = "3"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
