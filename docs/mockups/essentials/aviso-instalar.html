<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>notty · aviso «Instala essentials»</title>
<!--
  Maqueta del aviso de notty 1.1 cuando essentials NO está instalado, y de Ajustes →
  Actualizaciones en ese mismo caso. Sin código de la app: solo HTML.

  Fuente de verdad visual de partida (lo que ya existe en la app):
    · contenedor y entrada del popup  → crates/notty-ui/src/render/whats_new.rs
    · tarjeta de estado de Ajustes    → crates/notty-ui/src/settings_pages.rs (managed_card)
    · colores                         → crates/notty-ui/src/theme.rs (DARK / LIGHT, sRGB 0..1 × 255)
    · medidas de ventana              → crates/notty-ui/src/layout.rs, settings_window.rs

  Todo va en DIPs a escala 1, con las mismas cuentas que el renderizador, para poder
  comparar píxel a píxel con capturas de la ventana real:
    · ventana principal: área cliente 904×592 (la captura de tools/shot-settings.ps1 -Main
      es de 920×600 con el borde invisible: recórtala a x 8..912, y 0..592).
    · Ajustes: 820×620 (la captura de shot-settings.ps1 ya sale a ese tamaño).

  Modo captura: ?shot=<escenario>[&theme=light] pinta solo esa ventana en (0,0), sin
  animaciones. Escenarios: aviso, descargando, abriendo, error, novedades (el popup que
  ya existe, para calibrar el contenedor), ajustes, ajustes-descargando.
  Las capturas de referencia están en docs/mockups/ref/aviso-essentials-*.png y
  docs/mockups/ref/ajustes-sin-essentials*.png (Chrome sin ventana, escala 1).
-->
<style>
:root{
  --font-ui:"Segoe UI Variable Text","Segoe UI",system-ui,sans-serif;
  --font-mono:"Cascadia Mono","Cascadia Code",Consolas,monospace;
  --ease:cubic-bezier(.33,1,.68,1); /* ease_out_cubic */
}
/* theme.rs → DARK */
.t-dark{
  --chrome:rgb(42 43 45);--chrome-hi:rgb(47 48 50);--surface:rgb(29 30 31);--surface-2:rgb(35 36 37);--cmd:rgb(22 23 24);
  --hover:rgb(220 222 224 / .07);--press:rgb(220 222 224 / .12);--line:rgb(50 51 52);
  --text:rgb(229 230 231);--text-2:rgb(151 152 154);--text-3:rgb(87 88 90);--text-hint:rgb(218 219 220);
  --accent:rgb(115 182 250);--accent-soft:rgb(115 182 250 / .16);--accent-14:rgb(115 182 250 / .14);--accent-hover:rgb(132 189 247);
  --on-accent:rgb(14 18 22);--danger:rgb(242 113 102);--danger-soft:rgb(242 113 102 / .14);--ok:rgb(115 195 133);
  --line-half:rgb(50 51 52 / .25);
  --sh:0 0 0;--sha:.6;--ring:rgb(102 105 107 / .09);
  color-scheme:dark;
}
/* theme.rs → LIGHT */
.t-light{
  --chrome:rgb(232 234 235);--chrome-hi:rgb(246 247 248);--surface:rgb(251 252 253);--surface-2:rgb(239 240 242);--cmd:rgb(246 247 248);
  --hover:rgb(98 99 101 / .08);--press:rgb(98 99 101 / .14);--line:rgb(214 216 217);
  --text:rgb(25 27 28);--text-2:rgb(84 85 87);--text-3:rgb(138 140 142);--text-hint:rgb(32 34 35);
  --accent:rgb(0 106 192);--accent-soft:rgb(0 106 192 / .12);--accent-14:rgb(0 106 192 / .14);--accent-hover:rgb(3 97 173);
  --on-accent:rgb(250 252 254);--danger:rgb(197 44 42);--danger-soft:rgb(197 44 42 / .14);--ok:rgb(40 124 66);
  --line-half:rgb(214 216 217 / .25);
  --sh:5 8 13;--sha:.28;--ring:rgb(5 8 13 / .06);
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font:13px/1.4 var(--font-ui);background:#141516;color:#e5e6e8}
svg{display:block;overflow:visible}
svg .st{fill:none;stroke:currentColor;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}

/* ================= ventana principal (área cliente 904×592) ================= */
.main{position:relative;width:904px;height:592px;background:var(--surface);color:var(--text);overflow:hidden;font-family:var(--font-ui)}
.tb{position:absolute;left:0;top:0;right:0;height:32px;background:var(--chrome)}
.tb .logo{position:absolute;left:10px;top:8px}
.tab{position:absolute;left:36px;top:4px;height:28px;display:flex;align-items:center;gap:6px;padding:0 6px 0 12px;border-radius:6px 6px 0 0;background:var(--surface);font-size:12px;color:var(--text);white-space:nowrap}
.tab .x{width:18px;height:18px;display:grid;place-items:center;color:var(--text-3)}
.plus{position:absolute;top:6px;width:28px;height:24px;display:grid;place-items:center;color:var(--text-3)}
.capt{position:absolute;top:0;height:32px;display:grid;place-items:center;color:var(--text-2)}
.sep{position:absolute;left:0;right:0;top:31px;height:2px;background:var(--line-half)}
.gut{position:absolute;left:0;top:42px;width:38px;height:20px;display:flex;align-items:center;justify-content:flex-end;font:13px var(--font-mono);color:var(--text)}
.caret{position:absolute;left:56px;top:44px;width:1px;height:16px;background:var(--text)}
.hints{position:absolute;left:0;right:0;top:546px;height:22px;background:var(--surface-2);border-top:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 12px;font:11px var(--font-mono);color:var(--text-2);white-space:pre}
.hints b{color:var(--text-hint);font-weight:700}
.status{position:absolute;left:0;right:0;top:568px;height:24px;background:var(--chrome);display:flex;align-items:center;padding:2px 12px 0;font-size:11px;color:var(--text-2);white-space:nowrap}
.status .fld{padding:2px 5px}
.status .fld.u{text-decoration:underline;text-decoration-color:var(--text-3);text-underline-offset:2px}
.status .r{margin-left:auto;margin-right:-5px;display:flex;gap:6px}

/* ================= popup (whats_new.rs: W 420, PAD 20, POPUP_RADIUS 8) ================= */
.pop{position:absolute;left:242px;width:420px;padding:20px;border-radius:8px;background:var(--chrome-hi);color:var(--text);
  /* draw_popup_shadow: 4 capas (dy, crece, alpha) + anillo de 1 px (shadow_ring) centrado en el borde */
  box-shadow:
    0 0 0 1px var(--ring), inset 0 0 0 1px var(--ring),
    0 1px 0 1px rgb(var(--sh) / calc(var(--sha) * .5)),
    0 2px 0 3px rgb(var(--sh) / calc(var(--sha) * .32)),
    0 4px 0 6px rgb(var(--sh) / calc(var(--sha) * .18)),
    0 7px 0 10px rgb(var(--sh) / calc(var(--sha) * .10));
}
.anim .pop{animation:popIn 220ms var(--ease) both}
@keyframes popIn{from{opacity:0;transform:translateY(10px)}}
/* filas escalonadas: 90 + 70·i ms, 300 ms, 8 px (las mismas que las novedades) */
.anim .pop .stg{animation:rowIn 300ms var(--ease) both;animation-delay:calc(90ms + 70ms * var(--i,0))}
@keyframes rowIn{from{opacity:0;transform:translateY(8px)}}

.thumb{flex:none;width:46px;height:46px;border-radius:11px;background:var(--surface);display:grid;place-items:center;color:var(--accent)}
.p-head{display:flex;gap:14px;align-items:center;min-height:46px}
/* DirectWrite pone el texto 1-2 px más abajo que Chrome con el mismo rect: .dw1/.dw2 lo compensan */
.dw1{position:relative;top:1px}.dw2{position:relative;top:2px}
.p-title{font-size:18px;font-weight:600;line-height:24px;margin:0;text-wrap:balance}
.p-body{margin:14px 0 0;font-size:12px;line-height:18px;color:var(--text-2)}
.p-foot{margin-top:20px;height:32px;display:flex;align-items:center;gap:8px}
.p-foot .grow{flex:1;min-width:0}
.btn{height:32px;padding:0 16px;border-radius:7px;display:inline-flex;align-items:center;font-size:12.5px;white-space:nowrap;flex:none}
.btn.pri{background:var(--accent);color:var(--on-accent);font-weight:600}
.btn.pri:hover{background:var(--accent-hover)}
.btn.sec{background:var(--hover);color:var(--text);padding:0 14px}
.btn.sec:hover{background:var(--press)}
/* barra de progreso: la misma que la descarga de Ajustes → Actualizaciones (6 px, pista cmd) */
.prog .lbl{display:flex;align-items:center;gap:7px;height:16px;font-size:12px;color:var(--text-2);white-space:nowrap}
.track{position:relative;margin-top:6px;height:6px;border-radius:3px;background:var(--cmd);overflow:hidden}
/* en el popup la pista va en press: cmd no se ve sobre chrome_hi en el tema claro */
.pop .track{background:var(--press)}
.track b{position:absolute;left:0;top:0;bottom:0;border-radius:3px;background:var(--accent);overflow:hidden}
.anim .track b::after{content:"";position:absolute;inset:0;width:40%;background:linear-gradient(90deg,transparent,rgb(255 255 255 / .25),transparent);animation:shine 1.2s linear infinite}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(250%)}}
.spin{color:var(--accent)}
.anim .spin{animation:spin .9s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.err{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--danger);white-space:nowrap}
.err .dot{width:20px;height:20px;border-radius:10px;background:var(--danger-soft);display:grid;place-items:center;flex:none}
.err a{color:var(--danger);font-weight:600;text-decoration:none;cursor:pointer;background:linear-gradient(currentColor,currentColor) 0 100%/0 1px no-repeat;transition:background-size .25s var(--ease)}
.err a:hover{background-size:100% 1px}
.err .mid{color:var(--danger);opacity:.6}

/* novedades (para calibrar el contenedor con la app) */
.nv-h{display:flex;justify-content:space-between}
.nv-t{font-size:18px;font-weight:600;height:26px;display:flex;align-items:center}
.nv-s{font-size:12px;color:var(--text-3);height:18px;display:flex;align-items:center;margin-top:4px}
.nv-x{width:24px;height:24px;margin:-2px -2px 0 0;display:grid;place-items:center;color:var(--text-2)}
.nv-rows{margin-top:18px;display:flex;flex-direction:column;gap:16px}
.nv-row{display:flex;gap:14px}
.nv-row h5{margin:0;font-size:12.5px;font-weight:600;height:20px;display:flex;align-items:center}
.nv-row p{margin:2px 0 0;font-size:11.5px;line-height:16px;color:var(--text-2)}
.nv-f{margin-top:22px;display:flex;justify-content:flex-end}

/* ================= Ajustes (820×620) ================= */
.set{position:relative;width:820px;height:620px;background:var(--surface);color:var(--text);overflow:hidden;font-family:var(--font-ui)}
.set .tb .logo{left:11px;top:9px}
.set .ttl{position:absolute;left:32px;top:0;height:32px;display:flex;align-items:center;font-size:12px;color:var(--text-2)}
.rail{position:absolute;left:0;top:32px;bottom:0;width:52px;background:var(--chrome);border-right:1px solid var(--line)}
.nav{position:absolute;left:6px;width:39px;height:36px;border-radius:6px;color:var(--text-2)}
.nav svg{position:absolute;left:11px;top:9px}
.nav.on{background:var(--accent-14);color:var(--accent)}
.ind{position:absolute;left:0;width:3px;height:16px;border-radius:1.5px;background:var(--accent)}
.pane{position:absolute;left:88px;top:54px;width:696px}
.pane h3{margin:0;height:28px;display:flex;align-items:center;font-size:20px;font-weight:600}
.card{position:relative;margin-top:14px;height:96px;border-radius:10px;background:var(--surface-2)}
.card.dl{height:138px}
.card .ic{position:absolute;left:22px;top:20px;width:56px;height:56px;border-radius:28px;background:var(--accent-soft);display:grid;place-items:center;color:var(--accent)}
.card .tx{position:absolute;left:96px;top:27.5px}
.card .h{height:22px;display:flex;align-items:center;padding-top:2px;font-size:16px;font-weight:600;white-space:nowrap}
.card .s{margin-top:3px;height:16px;display:flex;align-items:center;font-size:12px;color:var(--text-2);white-space:nowrap}
.card .b{position:absolute;right:22px;top:32px;height:32px;padding:0 14px;border-radius:6px;display:flex;align-items:center;font-size:12px;white-space:nowrap}
.card .b.pri{background:var(--accent);color:var(--on-accent);font-weight:600}
.card .b.sec{background:var(--chrome);color:var(--text)}
.card .bar{position:absolute;left:96px;right:22px;top:90px}
.card .bar .track{margin:0}
.card .bar .row{margin-top:6px;height:16px;display:flex;justify-content:space-between;align-items:center;font:11px var(--font-mono);color:var(--text-2)}
.card.in .ic, .card.in .tx, .card.in .b{animation:none}
.anim .card .ic svg{animation:pop 450ms cubic-bezier(.34,1.56,.64,1) both}
@keyframes pop{from{opacity:0;transform:scale(.4)}}

/* ================= galería ================= */
.gal{padding:28px 32px 48px;max-width:1900px}
.gal h1{font:600 20px "Segoe UI Variable Display","Segoe UI",sans-serif;margin:0 0 4px;letter-spacing:-.2px}
.gal .sub{color:#a9aaad;margin:0 0 22px;max-width:90ch;line-height:1.5}
.gal h2{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8a8b8e;margin:30px 0 10px 2px;font-weight:600}
.pair{display:flex;flex-wrap:wrap;gap:24px}
.frame .cap{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:#8a8b8e;margin:0 0 8px 2px;display:flex;gap:10px;align-items:center}
.frame .cap button{all:unset;cursor:pointer;color:#73b6fa;letter-spacing:0;text-transform:none;font-size:12px}
.frame .win{border-radius:8px;overflow:hidden;box-shadow:0 0 0 1px #34353a,0 18px 50px rgba(0,0,0,.5);width:max-content}
.notes{margin-top:30px;display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px 32px;font-size:13px;line-height:1.55;color:#c9cacd;max-width:1400px}
.notes b{display:block;margin-bottom:2px;color:#e5e6e8}
.notes code{font:12px var(--font-mono);color:#a9aaad}

body.shot{background:#000;overflow:hidden}
body.shot .win{border-radius:0}
@media (prefers-reduced-motion: reduce){.anim *{animation:none!important}}
</style>
</head>
<body>
<div id="root"></div>
<script>
/* ---------- iconos (lienzo 24×24, como settings_ui.rs::icon) ---------- */
const P = {
  // essentials: una bolsa de la compra (genérica; no es el logo de essentials)
  BOLSA: 'M5 8h14l-1.1 11.2a2 2 0 0 1-2 1.8H8.1a2 2 0 0 1-2-1.8zM9 10.5V7a3 3 0 0 1 6 0v3.5',
  ACTUALIZAR: 'M21 12a9 9 0 1 1-2.6-6.4M21 4v5h-5',
  DESCARGA: 'M12 4v11M7 10l5 5 5-5M5 20h14',
  GIRO: 'M21 12a9 9 0 1 1-9-9',
  CRUZ: 'M6 6l12 12M18 6 6 18',
  APARIENCIA: 'M12 3a9 9 0 1 0 0 18c1.1 0 1.8-.8 1.8-1.7 0-.5-.2-.9-.5-1.2-.3-.3-.5-.7-.5-1.2 0-1 .8-1.7 1.8-1.7H17a4 4 0 0 0 4-4c0-4.4-4-8.2-9-8.2zM6.5 10.5a1 1 0 1 0 2 0a1 1 0 1 0-2 0M9.5 7a1 1 0 1 0 2 0a1 1 0 1 0-2 0M14 7.5a1 1 0 1 0 2 0a1 1 0 1 0-2 0',
  VENTANA: 'M5 4h14a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM3 9h18',
  TECLADO: 'M4.5 6h15a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2h-15a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2zM6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10',
  CARPETA: 'M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z',
  RAYO: 'M13 2 4 14h7l-1 8 9-12h-7z',
  INFO: 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M12 11v5M12 8h.01',
  AYUDA: 'M3 12a9 9 0 1 0 18 0a9 9 0 1 0-18 0M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.6.3-1 .9-1 1.6v.4M12 17h.01',
  ARCHIVO: 'M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8zM14 3v5h5',
};
// size en DIPs, width en DIPs (como stroke_svg: el trazo no escala con el icono)
const ic = (d, size, width, cls = '') =>
  `<svg class="${cls}" width="${size}" height="${size}" viewBox="0 0 24 24" aria-hidden="true"><path class="st" d="${d}" style="stroke-width:${width}px"/></svg>`;
// draw_logo: cuadrado redondeado (radio 0.22·s) en acento + "n_" en on_accent, trazo 2.4
const logo = s => `<svg class="logo" width="${s}" height="${s}" viewBox="0 0 24 24" aria-hidden="true"><rect width="24" height="24" rx="${24 * .22}" fill="var(--accent)"/><path class="st" d="M5.6 8.4V17M5.6 12.3a3.9 3.9 0 0 1 7.8 0V17M16.4 17h2.6" style="stroke:var(--on-accent);stroke-width:2.4px"/></svg>`;
const xglyph = (n, w, col) => `<svg width="${n}" height="${n}" viewBox="0 0 ${n} ${n}"><path d="M0 0L${n} ${n}M${n} 0L0 ${n}" stroke="${col}" stroke-width="${w}" fill="none"/></svg>`;
const gear = `<svg width="14" height="14" viewBox="-7 -7 14 14"><circle r="2.8" fill="none" stroke="currentColor" stroke-width="1"/>${[0,1,2,3,4,5].map(i=>{const a=Math.PI*2*i/6,c=Math.cos(a),s=Math.sin(a);return `<line x1="${c*4.2}" y1="${s*4.2}" x2="${c*6}" y2="${s*6}" stroke="currentColor" stroke-width="1"/>`}).join('')}</svg>`;

/* ---------- ventana principal, recién abierta ("sin ruta") ---------- */
function mainWin(popup) {
  return `<div class="main">
    <div class="tb">${logo(16)}
      <div class="tab">sin ruta<span class="x">${xglyph(10, 1.1, 'currentColor')}</span></div>
      <div class="plus" style="left:120px"><svg width="10" height="10" viewBox="0 0 10 10"><path d="M0 5h10M5 0v10" stroke="currentColor" stroke-width="1.1"/></svg></div>
      <div class="capt" style="left:726px;width:40px">${gear}</div>
      <div class="capt" style="left:766px;width:46px"><svg width="10" height="10"><path d="M0 5.5h10" stroke="currentColor"/></svg></div>
      <div class="capt" style="left:812px;width:46px"><svg width="10" height="10"><rect x=".5" y=".5" width="8.5" height="8.5" fill="none" stroke="currentColor"/></svg></div>
      <div class="capt" style="left:858px;width:46px">${xglyph(10, 1, 'currentColor')}</div>
    </div>
    <div class="sep"></div>
    <div class="gut">1</div><div class="caret"></div>
    <div class="hints"><span><b>^S</b> Guardar</span><span><b>^F</b> Buscar</span><span><b>^H</b> Reemplazar</span><span><b>^O</b> Abrir</span><span><b>^Alt+V</b> Vim</span></div>
    <div class="status"><span class="fld u">Guardar como…</span><span class="r"><span class="fld">Ln 1, Col 1</span><span class="fld">UTF-8</span><span class="fld">CRLF</span></span></div>
    ${popup}
  </div>`;
}

/* ---------- el aviso ---------- */
const TITLE = 'notty ahora se actualiza desde essentials';
const BODY = 'essentials es la tienda de tus apps: instala, actualiza y desinstala notty y las demás desde un sitio. Sin cuentas ni telemetría. Mientras no la instales, notty no se actualiza.';
const PCT = 42;

function foot(state) {
  switch (state) {
    case 'aviso': return `<span class="grow"></span>
      <span class="btn sec">Ahora no</span><span class="btn pri">Instalar essentials</span>`;
    case 'descargando': return `<div class="grow prog">
        <div class="lbl"><span>Descargando essentials · ${PCT} %</span></div>
        <div class="track"><b style="width:${PCT}%"></b></div></div>
      <span class="btn sec" style="margin-left:16px">Cancelar</span>`;
    case 'abriendo': return `<div class="grow prog">
        <div class="lbl">${ic(P.GIRO, 14, 2, 'spin')}Abriendo el instalador…</div>
        <div class="track"><b style="width:100%"></b></div></div>`;
    case 'error': return `<div class="grow err">
        <span class="dot">${ic(P.CRUZ, 12, 1.8)}</span>
        <span>No se pudo descargar</span><span class="mid">·</span><a>Reintentar</a></div>
      <span class="btn sec">Ahora no</span>`;
  }
}

function aviso(state) {
  return `<div class="pop" role="dialog" aria-labelledby="t">
    <div class="p-head stg" style="--i:0"><span class="thumb">${ic(P.BOLSA, 24, 1.8)}</span><h4 class="p-title dw1" id="t">${TITLE}</h4></div>
    <p class="p-body stg" style="--i:1"><span class="dw1" style="display:block">${BODY}</span></p>
    <div class="p-foot stg" style="--i:2">${foot(state)}</div>
  </div>`;
}

/* ---------- Novedades tal y como están (whats_new.rs), para calibrar ---------- */
function novedades() {
  const row = (t, d) => `<div class="nv-row"><span class="thumb"><svg width="20" height="20" viewBox="-10 -10 20 20"><path d="M-9 0H9M0 -9V9" stroke="currentColor" stroke-width="1.6"/></svg></span><div style="width:320px"><h5><span class="dw2">${t}</span></h5><p><span class="dw1" style="display:block">${d}</span></p></div></div>`;
  return `<div class="pop">
    <div class="nv-h"><div><div class="nv-t"><span class="dw1">Novedades</span></div><div class="nv-s">notty 1.1.0</div></div><span class="nv-x">${xglyph(9, 1.4, 'currentColor')}</span></div>
    <div class="nv-rows">
      ${row('Actualizaciones desde essentials', 'Si tienes essentials, notty se actualiza desde la tienda. Lo verás en Ajustes → Actualizaciones.')}
      ${row('El mismo tema que essentials', 'notty sigue el tema y el color de acento de essentials al momento. Se apaga en Ajustes → Apariencia.')}
    </div>
    <div class="nv-f"><span class="btn pri">Entendido</span></div>
  </div>`;
}

/* ---------- Ajustes → Actualizaciones sin essentials ---------- */
function ajustes(dl) {
  const icons = [P.APARIENCIA, P.VENTANA, P.TECLADO, P.CARPETA, P.RAYO, P.ACTUALIZAR, P.INFO, P.AYUDA];
  const nav = icons.map((d, i) => `<div class="nav${i === 5 ? ' on' : ''}" style="top:${10 + 38 * i}px">${ic(d, 18, 1.6)}</div>`).join('');
  const card = dl
    ? `<div class="card dl">
        <div class="ic">${ic(P.DESCARGA, 24, 2)}</div>
        <div class="tx"><div class="h">Descargando essentials</div><div class="s">Al terminar se abre su instalador.</div></div>
        <span class="b sec">Cancelar</span>
        <div class="bar"><div class="track"><b style="width:${PCT}%"></b></div><div class="row"><span>github.com/s7lver2/essentials</span><span>${PCT} %</span></div></div>
      </div>`
    : `<div class="card">
        <div class="ic">${ic(P.BOLSA, 24, 2)}</div>
        <div class="tx"><div class="h">Instala essentials para recibir actualizaciones</div><div class="s">Mientras no la instales, notty no se actualiza.</div></div>
        <span class="b pri">Instalar essentials</span>
      </div>`;
  return `<div class="set">
    <div class="tb">${logo(14)}<div class="ttl">Ajustes · notty</div>
      <div class="capt" style="left:774px;width:46px">${ic(P.CRUZ, 20, 1.56)}</div></div>
    <div class="rail">${nav}<div class="ind" style="top:${10 + 38 * 5 + 10}px"></div>
      <div class="nav" style="top:${620 - 32 - 46}px">${ic(P.ARCHIVO, 18, 1.6)}</div></div>
    <div class="pane"><h3>Actualizaciones</h3>${card}</div>
  </div>`;
}

const SCENES = {
  'aviso':               { name: 'Aviso al arrancar', html: () => mainWin(aviso('aviso')) },
  'descargando':         { name: 'Descargando', html: () => mainWin(aviso('descargando')) },
  'abriendo':            { name: 'Comprobado: abriendo el instalador', html: () => mainWin(aviso('abriendo')) },
  'error':               { name: 'Error de descarga', html: () => mainWin(aviso('error')) },
  'novedades':           { name: 'Novedades (ya existe, para calibrar)', html: () => mainWin(novedades()) },
  'ajustes':             { name: 'Ajustes → Actualizaciones sin essentials', html: () => ajustes(false) },
  'ajustes-descargando': { name: 'Ajustes → Actualizaciones, descargando', html: () => ajustes(true) },
};

/* whats_new.rs: top = body.top + (body.h − h)/2, con body = 32..546 */
function place(scope) {
  scope.querySelectorAll('.main .pop').forEach(p => {
    const h = p.offsetHeight;
    p.style.top = Math.max(32 + 8, 32 + (514 - h) / 2) + 'px';
  });
}

const Q = new URLSearchParams(location.search);
const root = document.getElementById('root');
if (Q.has('shot')) {
  document.body.className = 'shot';
  const s = SCENES[Q.get('shot')] || SCENES.aviso;
  root.innerHTML = `<div class="win t-${Q.get('theme') === 'light' ? 'light' : 'dark'}">${s.html()}</div>`;
  place(root);
} else {
  const frame = (k, th) => `<div class="frame"><div class="cap">${SCENES[k].name} · ${th === 'dark' ? 'oscuro' : 'claro'}<button data-replay>Repetir entrada</button></div>
    <div class="win anim t-${th}">${SCENES[k].html()}</div></div>`;
  const sect = (title, keys) => `<h2>${title}</h2>` + keys.map(k => `<div class="pair">${frame(k, 'dark')}${frame(k, 'light')}</div>`).join('<div style="height:24px"></div>');
  root.innerHTML = `<div class="gal">
    <h1>Aviso «Instala essentials» · notty 1.1</h1>
    <p class="sub">Sale al arrancar notty 1.1 si essentials no está instalado. notty funciona igual; el aviso solo flota encima del editor, con el mismo contenedor y la misma entrada que Novedades (fundido + 10 px en 220 ms, filas escalonadas 70 ms). Vuelve a salir en cada arranque hasta que essentials esté instalado.</p>
    ${sect('Aviso: los cuatro estados', ['aviso', 'descargando', 'abriendo', 'error'])}
    ${sect('Ajustes → Actualizaciones', ['ajustes', 'ajustes-descargando'])}
    ${sect('Referencia: el popup que ya existe', ['novedades'])}
    <div class="notes">
      <div><b>Botones</b>«Instalar essentials» descarga el instalador de essentials (release de GitHub) y lo abre. «Ahora no» y Esc cierran el aviso solo en esta sesión. No hay ✕: el secundario ya cierra.</div>
      <div><b>Descargando</b>La barra es la de Ajustes → Actualizaciones (6 px, radio 3, brillo que la recorre), con la pista en <code>press</code> en vez de <code>cmd</code>: sobre <code>chrome_hi</code> claro, <code>cmd</code> no se ve. «Cancelar» corta la descarga y vuelve al estado normal.</div>
      <div><b>Abriendo</b>Al terminar se comprueba el archivo y se abre el instalador; sin botones, porque ya no hay nada que cancelar. El aviso se cierra solo cuando el instalador arranca.</div>
      <div><b>Error</b>Texto en <code>danger</code> con «Reintentar» como enlace (subrayado que crece al pasar el ratón). «Ahora no» sigue a la derecha.</div>
      <div><b>Ajustes</b>Misma tarjeta que «Gestionado por essentials»: 96 px de alto, círculo de 56 px en <code>accent_soft</code>, título 16 semibold, botón principal a 22 px del borde. Descargando crece a 138 px con la barra.</div>
      <div><b>Icono</b>La bolsa es un icono genérico de tienda en el lienzo de 24×24 de <code>settings_ui::icon</code>; se cambia por el de essentials si lo hay.</div>
    </div>
  </div>`;
  place(root);
  root.addEventListener('click', e => {
    const b = e.target.closest('[data-replay]'); if (!b) return;
    const w = b.closest('.frame').querySelector('.win');
    w.classList.remove('anim'); void w.offsetWidth; w.classList.add('anim');
  });
}
</script>
</body>
</html>
